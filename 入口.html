<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LexiNote · 正在前往登录页</title>
<!--
  历史入口文件，保留给手动双击或旧链接。
  新入口是项目根目录的 index.html（版式更完整、有排错说明），两者跳转目标相同。

  一律写 127.0.0.1 而不是 localhost：本机系统代理会把 localhost 也转走，
  代理回 502，页面打不开；127.0.0.1 按本地地址放行，能正常访问。
-->
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: #fbfbf8;
    color: #54564e;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.7;
    text-align: center;
  }
  a { color: #7c1c14; }
  code { font-family: "IBM Plex Mono", Consolas, monospace; font-size: 12px; }
</style>
<script>
  window.location.replace('http://127.0.0.1:3100/login');
</script>
</head>
<body>
  <p>正在前往登录页……如果没有自动跳转，请<a href="http://127.0.0.1:3100/login">点此进入</a>。</p>
  <p style="color:#9a9c92;font-size:12px">
    打不开请确认本地服务已启动：双击 <code>打开平台.cmd</code>
  </p>
</body>
</html>
